# Konfigurasi Kategori Target FastMoss Scraper

# Kategori target resmi FastMoss
target_hierarchy:
  l1: "Pakaian & Pakaian Dalam Wanita"
  l2: "Bawahan Wanita"
  l3_allowed:
    - "Rok"
    - "Celana Pendek"
    - "Legging"
    - "Jeans"
    - "Celana Panjang"
    - "Skirt Pants & Skorts"

# Kata kunci fallback nama produk bila FastMoss tidak memuat breadcrumb kategori
fallback_keywords:
  indonesia:
    - "rok"
    - "celana"
    - "celana pendek"
    - "legging"
    - "jeans"
    - "kulot"
    - "culotte"
    - "skort"
    - "skorts"
    - "short pants"
    - "pants"
    - "trousers"
    - "bawahan"
    - "cutbray"
    - "jogger pants"
    - "cargo pants"
    - "baggy pants"
    - "wide leg pant"
    - "sweatpants"
    - "hotpants"
  malaysia:
    - "seluar"
    - "seluar pendek"
    - "seluar jeans"
    - "skirt"
    - "palazzo"
    - "jeans"
    - "pants"
    - "slack"
    - "slacks"
    - "short pants"
    - "sweatpants"

# Kata kunci pengecualian (bukan bawahan wanita: atasan, baju, dress, baju kurung, pria/lelaki)
exclude_keywords:
  - "baju"
  - "kaos"
  - "t-shirt"
  - "tshirt"
  - "kemeja"
  - "shirt"
  - "blouse"
  - "blus"
  - "tunik"
  - "tunic"
  - "dress"
  - "gamis"
  - "baju kurung"
  - "atasan"
  - "croptop"
  - "crop top"
  - "jaket"
  - "jacket"
  - "sweater"
  - "hoodie"
  - "cardigan"
  - "outer"
  - "blazer"
  - "rompi"
  - "vest"
  - "bra"
  - "underwear"
  - "lingerie"
  - "hijab"
  - "jilbab"
  - "kerudung"
  - "pashmina"
  - "khimar"
  - "sepatu"
  - "shoes"
  - "sandal"
  - "tas"
  - "bag"

# Kata kunci pria / lelaki
exclude_gender_keywords:
  - "pria"
  - "lelaki"
  - "men"
  - "man"
  - "cowok"

# Parameter scraping santai (prioritas akurasi)
scraping_pace:
  min_delay_seconds: 3.0
  max_delay_seconds: 7.0
  page_timeout_seconds: 30
  wait_after_search_seconds: 4.0
  wait_after_filter_seconds: 3.5
  max_videos_per_creator_default: 50
