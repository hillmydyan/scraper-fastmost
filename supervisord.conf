[supervisord]
nodaemon=true
user=root
logfile=/app/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -ac +extension GLX +render -noreset
autorestart=true
priority=100

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -shared -rfbport 5900 -listen 127.0.0.1
autorestart=true
priority=200

[program:websockify]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=300

[program:flask_app]
command=python app.py
directory=/app
autorestart=true
priority=400
stdout_logfile=/app/storage/logs/flask_app.log
stderr_logfile=/app/storage/logs/flask_err.log

