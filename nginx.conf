# Konfigurasi Nginx Reverse Proxy untuk FastMoss Scraper di VPS
# Simpan di /etc/nginx/sites-available/fastmoss.conf

server {
    listen 80;
    server_name fastmoss.kurmagroup.com; # Ganti dengan domain/subdomain Anda

    client_max_body_size 50M;

    # 1. Reverse proxy ke Web App (Flask)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout panjang untuk file upload & long scraping requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 2. Reverse proxy ke noVNC (WebSockets)
    location /vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /websockify {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

